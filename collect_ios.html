    L(lines, 'errors', JSON.stringify(d.errors || []));
    var json = JSON.stringify(d);
    L(lines, 'size', json.length + ' bytes  (basis: ' + d.consent + ')');
    out.textContent = lines.join('\n');
    st.textContent = 'Done — tap Download, save to Files.';
    var dl = document.getElementById('dl');
    dl.disabled = false;
    dl.onclick = function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = 'fingerprint-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
    };
    var cp = document.getElementById('cp');
    cp.disabled = false;
    cp.onclick = function () {
      navigator.clipboard.writeText(json).then(function () { cp.textContent = 'Copied'; }, function () { cp.textContent = 'Copy failed'; });
    };
    window.__fpDone = true;
  }).catch(function (e) { st.textContent = 'Error: ' + e; });
}
document.getElementById('rr').onclick = function () { location.reload(); };
collectNow();
</script>
